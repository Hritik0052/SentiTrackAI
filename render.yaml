services:
  - type: web
    name: sentitrack-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Cashfree — set real values in Render Dashboard (never commit secrets)
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: "2023-08-01"
      - key: CASHFREE_RETURN_URL
        value: "https://sentitrackai.netlify.app/app/billing/return"
      - key: CASHFREE_WEBHOOK_URL
        value: "https://sentitrackai.onrender.com/api/v1/billing/cashfree/webhook"
